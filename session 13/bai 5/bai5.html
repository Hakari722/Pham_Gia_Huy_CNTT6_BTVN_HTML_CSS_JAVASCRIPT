<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Thống Kê Học Tập</title>

</head>
<body>

            <div class="number">2</div>

        <div class="stat-card">
            <div class="icon">✅</div>
            <div class="number">1</div>
            <div class="label">Hoàn thành</div>
        </div>

        <div class="stat-card">
            <div class="icon">⏰</div>
            <div class="number">43</div>
            <div class="label">Giờ học</div>
        </div>

        <div class="stat-card">
            <div class="icon">📄</div>
            <div class="number">1</div>

</html>
