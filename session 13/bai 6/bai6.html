<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách khóa học</title>
    <link rel="stylesheet" href="bai6.css">
</head>
<body>

<div class="course-wrapper">
    <div class="course-list">

        <div class="course-card">
            <div class="course-img">
                <span class="badge studying">Đang học</span>
                <img src="https://picsum.photos/400/250?1">
            </div>
            <div class="course-body">
                <span class="category">Thiết kế</span>
                <h3>UI/UX Design Chuyên Nghiệp</h3>

                <div class="progress">
                    <span>Tiến độ học tập</span>
                    <span class="percent">20%</span>
                </div>
                <div class="progress-bar">
                    <div style="width:20%"></div>
                </div>

                <div class="course-footer">
                    <button class="btn primary">Tiếp tục học</button>
                    <div class="icons">
                        <span>⭐</span>
                        <span>📄</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="course-card">
            <div class="course-img">
                <span class="badge done">Hoàn thành</span>
                <img src="https://picsum.photos/400/250?2">
            </div>
            <div class="course-body">
                <span class="category">Marketing</span>
                <h3>Digital Marketing Toàn Diện</h3>

                <div class="progress">
                    <span>Hoàn thành</span>
                    <span class="percent">100%</span>
                </div>
                <div class="progress-bar">
                    <div style="width:100%"></div>
                </div>

                <div class="course-footer">
                    <button class="btn outline">Xem lại</button>
                    <div class="icons">
                        <span>⭐</span>
                        <span>📄</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="course-card">
            <div class="course-img">
                <span class="badge new">Mới</span>
                <img src="https://picsum.photos/400/250?3">
            </div>
            <div class="course-body">
                <span class="category">AI & Data</span>
                <h3>Machine Learning Cơ Bản</h3>

                <div class="price">2.799.000đ</div>

                <div class="course-footer">
                    <button class="btn primary">Đăng ký ngay</button>
                    <div class="icons">
                        <span>⭐</span>
                        <span>📄</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
