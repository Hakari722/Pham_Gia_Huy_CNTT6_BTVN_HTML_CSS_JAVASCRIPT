<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt Bàn | La Belle Époque</title>
    <link rel="stylesheet" href="bai5.css">
</head>
<body>

<section class="hero">
    <div class="hero-content">
        <h1>Đặt Bàn Tại La Belle Époque</h1>
        <p>Trải nghiệm không gian Fine Dining sang trọng và dịch vụ hoàn hảo</p>
    </div>
</section>

<section class="gallery">
    <div class="gallery-item"><img src="1d07792a6205ebbe5cebd709b5e536398ef34f33.jpg"><span>Không Gian Chính</span></div>
    <div class="gallery-item"><img src="21bd4b7e82c5bc3a73e90a8379a61ef05dde6919.png"><span>Bàn Tiệc Tinh Tế</span></div>
    <div class="gallery-item"><img src="36b057a75e7e1f3bc9d3fb6dc45544c5c1748f67.png"><span>Món Ăn Nghệ Thuật</span></div>
    <div class="gallery-item"><img src="52c6caef2ca36da049c7af9fbe53e38d7691acc5.jpg"><span>Món Chính Cao Cấp</span></div>
    
    <div class="gallery-item"><img src="445baaeb3b0eb42b0599553bd3e9f66ec23208ff.jpg"><span>Bàn Ăn Lãng Mạn</span></div>
    <div class="gallery-item"><img src="d53e7e84ef400472206f678c2078826954141459.jpg"><span>Bếp Mở Hiện Đại</span></div>
</section>

<section class="reservation">
    <h2>Đặt Bàn Ngay Hôm Nay</h2>

    <form class="reservation-form">
        <input type="text" placeholder="Họ và tên">
        <input type="tel" placeholder="Số điện thoại">
        <input type="email" placeholder="Email">
        <input type="date">
        <input type="time">
        <select>
            <option>Số lượng khách</option>
            <option>1 - 2</option>
            <option>3 - 4</option>
            <option>5+</option>
        </select>

        <button type="submit">Gửi Yêu Cầu Đặt Bàn</button>
    </form>
</section>

<footer class="footer">
    © 2025 La Belle Époque – Fine Dining Restaurant. All rights reserved.
</footer>

</body>
</html>
